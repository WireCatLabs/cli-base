name: Release checks

on:
  workflow_dispatch:
    inputs:
      dependencies:
        type: boolean
        default: true
      languages:
        type: string
        default: '["actions","javascript-typescript"]'
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "24"
      dependencies:
        type: boolean
        default: true
      languages:
        type: string
        default: '["actions","javascript-typescript"]'

permissions:
  contents: read

jobs:
  dependencies:
    if: inputs.dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version || '24' }}
          package-manager-cache: false
      # The audit reads only the lockfile; installing would run dependency lifecycle scripts for nothing.
      - run: pnpm audit --prod --audit-level critical

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor
        env:
          ZIZMOR_VERSION: 1.30.1
          ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
        # Noncritical findings are reported for owner review; scanner failures still stop release.
        run: |
          curl -sSfLo zizmor.tar.gz "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  zizmor.tar.gz" | sha256sum -c -
          tar -xzf zizmor.tar.gz zizmor
          ./zizmor --offline --strict-collection --min-severity high --no-exit-codes .github

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: a secret removed in a later commit is still a leaked secret.
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          # Written here rather than read from the same release, which would only prove the two agree.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        # The binary, not gitleaks-action: the action asks an organisation account for a licence
        # key, and the tool itself is MIT and needs none.
        run: |
          curl -sSfLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .

  source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages || '["actions","javascript-typescript"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@f3c49fd1ef3281abc41069b3dd22807a60c963f6 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@f3c49fd1ef3281abc41069b3dd22807a60c963f6 # v4
        with:
          output: sarif
          upload: false
          category: release/${{ matrix.language }}
      - name: publish source analysis to security alerts
        if: always() && github.ref == 'refs/heads/main'
        uses: github/codeql-action/upload-sarif@f3c49fd1ef3281abc41069b3dd22807a60c963f6 # v4
        with:
          sarif_file: sarif
          category: release/${{ matrix.language }}
      - name: critical source findings
        # Inline because a called workflow checks out the caller, not cli-base; -I keeps the
        # caller's files off sys.path. scripts/release-checks.test.ts runs this block.
        run: |
          python3 -I - sarif <<'PYCODE'
          import json, pathlib, sys

          def fail(message):
              print(f"CodeQL gate: {message}", file=sys.stderr)
              raise SystemExit(1)

          def at(items, index):
              if isinstance(index, int) and 0 <= index < len(items):
                  return items[index]
              return None

          def resolve(result, driver, extensions):
              # CodeQL 2.27 leaves driver.rules empty and puts every rule in an extension (query pack).
              ref = result.get("rule") or {}
              component = ref.get("toolComponent")
              if isinstance(component, dict) and "index" in component:
                  rule = at((at(extensions, component["index"]) or {}).get("rules", []), ref.get("index"))
              else:
                  rule = at(driver.get("rules", []), ref.get("index", result.get("ruleIndex")))
              if rule is not None:
                  return rule
              rule_id = result.get("ruleId") or ref.get("id")
              matches = [r for c in [driver, *extensions] for r in c.get("rules", []) if r.get("id") == rule_id]
              return max(matches, key=severity, default=None)

          def severity(rule):
              # Quality queries carry no security-severity; they are not security findings.
              return float(rule.get("properties", {}).get("security-severity", 0))

          def count(path):
              critical = 0
              for run in json.loads(path.read_text())["runs"]:
                  tool = run["tool"]
                  for result in run.get("results", []):
                      rule = resolve(result, tool["driver"], tool.get("extensions", []))
                      if rule is None:
                          fail(f"{path.name}: rule {result.get('ruleId')!r} is not in the report, so its severity is unknown")
                      critical += severity(rule) >= 9
              return critical

          reports = sorted(pathlib.Path(sys.argv[1]).glob("*.sarif"))
          if not reports:
              fail("CodeQL produced no SARIF report")
          critical = 0
          for path in reports:
              try:
                  critical += count(path)
              except (OSError, ValueError, KeyError, TypeError, AttributeError) as error:
                  fail(f"{path.name} is not SARIF this gate can read ({error!r})")
          print(f"CodeQL: {critical} critical findings; other findings require owner review")
          raise SystemExit(1 if critical else 0)
          PYCODE
