name: Monthly validation

on:
  schedule:
    - cron: "17 2 1 * *"
  workflow_dispatch:

concurrency:
  group: monthly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
  security:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/release-checks.yml
    with:
      dependencies: true
      languages: '["actions","javascript-typescript"]'
